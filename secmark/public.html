<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMEL - вторичный рынок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #001f3f;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #0036944f;
            border: solid #eef4ff54 1px;
            border-radius: 20px;
            font-size: 1.5rem;
        }

        .stats {
            text-align: center;
            margin: 10px auto;
            padding: 8px;
            background: #0036944f;
            border-radius: 15px;
            display: inline-block;
            width: auto;
            font-size: 0.9rem;
        }

        .stats-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .mainlist {
            max-width: 1400px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .product-card {
            background: #0036944f;
            border: solid #eef4ff54 1px;
            border-radius: 15px;
            padding: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .product-icon {
            width: 100px;
            height: 100px;
            background: #001f3f;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .product-icon:hover {
            transform: scale(1.05);
        }

        .product-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-icon div {
            font-size: 50px;
        }

        .product-name {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: #ffd700;
            word-break: break-word;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 8px 0;
        }

        .product-description {
            font-size: 0.75rem;
            color: #e0e0e0;
            margin: 8px 0;
            line-height: 1.3;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-description p {
            margin: 0;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 8px 0;
        }

        .tag {
            background: rgba(255,255,255,0.15);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
        }

        .product-backcom {
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 0.7rem;
            word-break: break-word;
        }

        .product-backcom strong {
            font-size: 0.7rem;
        }

        .product-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            text-align: center;
            width: 100%;
        }

        .message-link, .phone-link {
            color: #4CAF50;
            text-decoration: none;
            word-break: break-all;
        }

        .message-link:hover, .phone-link:hover {
            text-decoration: underline;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 40px;
            font-size: 1rem;
            color: #aaa;
        }

        .error {
            color: #f44336;
        }

        .refresh-btn {
            display: block;
            margin: 10px auto;
            padding: 8px 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .refresh-btn:hover {
            background: #1976D2;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            max-width: 800px;
            margin: 20px auto;
            background: #001f3f;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 35px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
            transition: transform 0.2s;
        }

        .modal-close:hover {
            transform: scale(1.1);
        }

        .modal-close-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 24px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: monospace;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: #d32f2f;
        }

        .modal-icon {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: #0036944f;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-icon div {
            font-size: 100px;
        }

        .modal-name {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            color: #ffd700;
            margin: 20px 0;
            word-break: break-word;
        }

        .modal-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 15px 0;
        }

        .modal-description {
            font-size: 1rem;
            color: #e0e0e0;
            margin: 15px 0;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-backcom {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .modal-backcom strong {
            font-size: 1rem;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            justify-content: center;
        }

        .modal-tag {
            background: rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .modal-type {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            text-align: center;
            margin: 15px auto;
            display: table;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .modal-content {
                margin: 10px;
                padding: 15px;
            }
            
            .modal-icon {
                width: 150px;
                height: 150px;
            }
            
            .modal-name {
                font-size: 1.3rem;
            }
            
            .modal-price {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>📦 Вторичный рынок - Публичные товары</h1>
        <div class="stats-container">
            <div id="stats" class="stats"></div>
            <button class="refresh-btn" onclick="manualRefresh()">🔄 Обновить</button>
        </div>
        <div id="mainlist" class="mainlist">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="productModal" class="modal" onclick="closeModalOnBackground(event)">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalIcon" class="modal-icon"></div>
            <div id="modalName" class="modal-name"></div>
            <div id="modalPrice" class="modal-price"></div>
            <div id="modalDescription" class="modal-description"></div>
            <div id="modalTags" class="modal-tags"></div>
            <div id="modalBackcom" class="modal-backcom"></div>
            <div id="modalType" class="modal-type"></div>
            <button class="modal-close-btn" onclick="closeModal()">✖ Закрыть</button>
        </div>
    </div>
    
    <script>
        let currentProducts = {};
        let isLoading = false;
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }
        
        function linkifyText(text) {
            if (!text || text === 'None' || text === null) return 'Нет информации';
            
            let safeText = escapeHtml(String(text));
            const parts = [];
            let lastIndex = 0;
            const urlPattern = /(https?:\/\/[^\s<>\"]+)/gi;
            let match;
            
            while ((match = urlPattern.exec(safeText)) !== null) {
                if (match.index > lastIndex) {
                    parts.push(safeText.substring(lastIndex, match.index));
                }
                
                const url = match[0];
                let displayUrl = url;
                if (displayUrl.length > 40) {
                    displayUrl = displayUrl.substring(0, 37) + '...';
                }
                parts.push(`<a href="${url}" target="_blank" rel="noopener noreferrer" class="message-link" title="${escapeHtml(url)}">${escapeHtml(displayUrl)}</a>`);
                
                lastIndex = match.index + url.length;
            }
            
            if (lastIndex < safeText.length) {
                parts.push(safeText.substring(lastIndex));
            }
            
            if (parts.length === 0) {
                return safeText;
            }
            
            return parts.join('');
        }
        
        function formatPhoneNumbers(text) {
            if (!text) return text;
            const phonePattern = /(\+?\d[\d\s\-\(\)]{7,}\d)/g;
            return text.replace(phonePattern, (phone) => {
                const cleanPhone = phone.replace(/[\s\-\(\)]/g, '');
                return `<a href="tel:${cleanPhone}" class="phone-link" title="Нажать для звонка">${escapeHtml(phone)}</a>`;
            });
        }
        
        function getProductIcon(icon, productId, isModal = false) {
            if (!icon || icon === 'None' || icon === null) {
                return '<div>📦</div>';
            }
            
            if (typeof icon === 'string' && icon.includes('|')) {
                return `<img src="https://tbs-server-s7vy.onrender.com/secmark/get_icon/?product_id=${productId}" alt="иконка" onerror="this.parentElement.innerHTML='<div>📦</div>'">`;
            }
            
            if (icon.startsWith('data:image')) {
                return `<img src="${icon}" alt="иконка" onerror="this.parentElement.innerHTML='<div>📦</div>'">`;
            }
            
            if (icon.startsWith('http')) {
                return `<img src="${icon}" alt="иконка" onerror="this.parentElement.innerHTML='<div>📦</div>'">`;
            }
            
            return `<div>${icon}</div>`;
        }
        
        function formatPrice(price) {
            if (!price || price === 'None' || price === null) return 'Цена не указана';
            return `💰 ${escapeHtml(String(price))}`;
        }
        
        function formatDescription(description, isModal = false) {
            if (!description || description === 'None' || description === null) return 'Нет описания';
            let text = escapeHtml(String(description));
            if (!isModal && text.length > 100) {
                text = text.substring(0, 100) + '...';
            }
            text = text.replace(/\n/g, '<br>');
            return text;
        }
        
        function formatBackcom(backcom, isModal = false) {
            if (!backcom || backcom === 'None' || backcom === null) return 'Нет информации';
            let result = linkifyText(backcom);
            result = formatPhoneNumbers(result);
            result = result.replace(/\n/g, '<br>');
            if (!isModal && result.length > 150) {
                result = result.substring(0, 150) + '...';
            }
            return result;
        }
        
        function getProductTypeClass(type) {
            const types = {
                'product': '#4CAF50',
                'service': '#2196F3',
                'vacancy': '#FF9800'
            };
            return types[type] || '#757575';
        }
        
        function getProductTypeName(type) {
            const typeNames = {
                'product': '📦 Товар',
                'service': '🔧 Услуга',
                'vacancy': '💼 Вакансия'
            };
            return typeNames[type] || type || '📄 Общее';
        }
        
        function openModal(productId) {
            const product = currentProducts[productId];
            if (!product) return;
            
            const modal = document.getElementById('productModal');
            
            document.getElementById('modalIcon').innerHTML = getProductIcon(product.icon, productId, true);
            document.getElementById('modalName').innerHTML = escapeHtml(product.name || 'Без названия');
            document.getElementById('modalPrice').innerHTML = formatPrice(product.price);
            document.getElementById('modalDescription').innerHTML = formatDescription(product.description, true);
            
            if (product.special && product.special.tags && product.special.tags.length > 0) {
                const tagsHtml = product.special.tags.map(tag => `<span class="modal-tag">#${escapeHtml(tag)}</span>`).join('');
                document.getElementById('modalTags').innerHTML = tagsHtml;
            } else {
                document.getElementById('modalTags').innerHTML = '';
            }
            
            document.getElementById('modalBackcom').innerHTML = `<strong>📞 Связь:</strong><br>${formatBackcom(product.backcom, true)}`;
            document.getElementById('modalType').innerHTML = getProductTypeName(product.type);
            document.getElementById('modalType').style.background = getProductTypeClass(product.type);
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function closeModalOnBackground(event) {
            if (event.target === event.currentTarget) {
                closeModal();
            }
        }
        
        function createProductCard(key, product) {
            const safeName = escapeHtml(product.name || 'Без названия');
            const shortName = safeName.length > 40 ? safeName.substring(0, 37) + '...' : safeName;
            
            return `
                <div class="product-card" data-id="${escapeHtml(String(key))}" onclick="openModal('${escapeHtml(String(key))}')">
                    <div class="product-icon" onclick="event.stopPropagation(); openModal('${escapeHtml(String(key))}')">
                        ${getProductIcon(product.icon, key, false)}
                    </div>
                    <div class="product-name" title="${safeName}">
                        ${shortName}
                    </div>
                    <div class="product-price">
                        ${formatPrice(product.price)}
                    </div>
                    <div class="product-description">
                        <p>${formatDescription(product.description, false)}</p>
                    </div>
                    ${product.special && product.special.tags && product.special.tags.length > 0 ? `
                        <div class="product-tags">
                            ${product.special.tags.slice(0, 3).map(tag => `<span class="tag">#${escapeHtml(tag).substring(0, 15)}</span>`).join('')}
                        </div>
                    ` : ''}
                    <div class="product-backcom">
                        <strong>📞 Связь:</strong><br>
                        ${formatBackcom(product.backcom, false)}
                    </div>
                    <div class="product-type" style="background: ${getProductTypeClass(product.type)}">
                        ${getProductTypeName(product.type)}
                    </div>
                </div>
            `;
        }
        
        function renderProducts(productsDict) {
            const container = document.getElementById('mainlist');
            const productCount = Object.keys(productsDict).length;
            
            if (!productsDict || productCount === 0) {
                container.innerHTML = `<div class="empty-state"><p>📭 Публичных товаров пока нет</p></div>`;
                const statsDiv = document.getElementById('stats');
                if (statsDiv) statsDiv.innerHTML = '📊 Нет товаров';
                return;
            }
            
            const productsHTML = `<div class="products-grid">${Object.entries(productsDict).map(([key, product]) => createProductCard(key, product)).join('')}</div>`;
            container.innerHTML = productsHTML;
            
            const statsDiv = document.getElementById('stats');
            if (statsDiv) statsDiv.innerHTML = `📊 Всего товаров: ${productCount}`;
        }
        
        function clearAllCache() {
            try {
                localStorage.removeItem('somel_products_cache');
                localStorage.removeItem('somel_timestamps');
                localStorage.removeItem('somel_cached_ids');
                console.log('All cache cleared');
            } catch (e) {
                console.error('Clear cache error:', e);
            }
        }
        
        function saveToCache(products, idsWithTimestamps) {
            try {
                const cacheData = {
                    products: products,
                    timestamp: Date.now(),
                    version: '1.0'
                };
                localStorage.setItem('somel_products_cache', JSON.stringify(cacheData));
                
                if (idsWithTimestamps) {
                    localStorage.setItem('somel_timestamps', JSON.stringify(idsWithTimestamps));
                    localStorage.setItem('somel_cached_ids', JSON.stringify(Object.keys(idsWithTimestamps)));
                }
            } catch (e) {
                console.error('Save to cache error:', e);
            }
        }
        
        function loadFromCache() {
            try {
                const cached = localStorage.getItem('somel_products_cache');
                if (cached) {
                    const data = JSON.parse(cached);
                    if (data.timestamp && (Date.now() - data.timestamp) < 300000) {
                        return data.products;
                    }
                }
            } catch (e) {
                console.error('Load from cache error:', e);
            }
            return null;
        }
        
        function getCachedIds() {
            try {
                const cachedIds = localStorage.getItem('somel_cached_ids');
                if (cachedIds) {
                    return JSON.parse(cachedIds);
                }
            } catch (e) {}
            return [];
        }
        
        async function getPublicIds() {
            try {
                const url = 'https://tbs-server-s7vy.onrender.com/secmark/get_public/';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                console.log('Server response:', data);
                
                if (data.status === 'success') {
                    if (data.ids && typeof data.ids === 'object') {
                        const idsObject = data.ids;
                        const idsCount = Object.keys(idsObject).length;
                        console.log(`Server returned ${idsCount} products`);
                        
                        if (idsCount === 0) {
                            console.log('Server returned empty ids, clearing cache...');
                            clearAllCache();
                            return {};
                        }
                        
                        return idsObject;
                    }
                    return {};
                }
                return null;
            } catch (error) {
                console.error('Error fetching public IDs:', error);
                return null;
            }
        }
        
        async function getProductById(productId) {
            try {
                const url = `https://tbs-server-s7vy.onrender.com/secmark/get_product/?id=${encodeURIComponent(productId)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error fetching product:', error);
                return null;
            }
        }
        
        async function loadAllProducts() {
            if (isLoading) return;
            isLoading = true;
            
            const container = document.getElementById('mainlist');
            const statsDiv = document.getElementById('stats');
            
            try {
                const freshIdsWithTimestamps = await getPublicIds();
                
                if (!freshIdsWithTimestamps) {
                    if (statsDiv) statsDiv.innerHTML = '⚠️ Ошибка соединения';
                    return;
                }
                
                const freshIds = Object.keys(freshIdsWithTimestamps);
                
                if (freshIds.length === 0) {
                    console.log('No products on server, clearing display');
                    renderProducts({});
                    currentProducts = {};
                    clearAllCache();
                    return;
                }
                
                const cachedProducts = loadFromCache();
                const cachedIds = getCachedIds();
                
                if (cachedProducts && cachedIds.length > 0) {
                    renderProducts(cachedProducts);
                    currentProducts = cachedProducts;
                }
                
                const cachedTimestamps = JSON.parse(localStorage.getItem('somel_timestamps') || '{}');
                
                const productsToUpdate = {};
                const idsToDelete = [];
                
                for (const id of cachedIds) {
                    if (!freshIdsWithTimestamps[id]) {
                        idsToDelete.push(id);
                    }
                }
                
                for (const [id, freshTime] of Object.entries(freshIdsWithTimestamps)) {
                    const cachedTime = cachedTimestamps[id];
                    if (!cachedTime || freshTime > cachedTime) {
                        productsToUpdate[id] = freshTime;
                    }
                }
                
                const updateIds = Object.keys(productsToUpdate);
                
                if (updateIds.length > 0) {
                    console.log(`Updating ${updateIds.length} products...`);
                    if (statsDiv) statsDiv.innerHTML = `🔄 Обновление (${updateIds.length})...`;
                    
                    for (const id of updateIds) {
                        const product = await getProductById(id);
                        if (product && !product.error && product.status !== "Wrong ID!") {
                            currentProducts[id] = product;
                        }
                        await new Promise(resolve => setTimeout(resolve, 30));
                    }
                }
                
                if (idsToDelete.length > 0) {
                    console.log(`Deleting ${idsToDelete.length} products...`);
                    for (const id of idsToDelete) {
                        delete currentProducts[id];
                    }
                }
                
                renderProducts(currentProducts);
                saveToCache(currentProducts, freshIdsWithTimestamps);
                
                if (statsDiv) statsDiv.innerHTML = `📊 Всего товаров: ${Object.keys(currentProducts).length}`;
                
            } catch (error) {
                console.error('Load error:', error);
                const cachedProducts = loadFromCache();
                if (cachedProducts && Object.keys(cachedProducts).length > 0) {
                    renderProducts(cachedProducts);
                    if (statsDiv) statsDiv.innerHTML = `📊 Всего товаров: ${Object.keys(cachedProducts).length} (кеш)`;
                } else {
                    container.innerHTML = `
                        <div class="empty-state error">
                            <p>❌ Ошибка загрузки данных</p>
                            <button onclick="location.reload()" style="margin-top: 15px; padding: 8px 16px;">Повторить</button>
                        </div>
                    `;
                }
            } finally {
                isLoading = false;
            }
        }
        
        async function manualRefresh() {
            clearAllCache();
            await loadAllProducts();
        }
        
        let updateInterval = null;
        
        function startBackgroundUpdates() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (!isLoading) {
                    loadAllProducts();
                }
            }, 60000);
        }
        
        function stopBackgroundUpdates() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }
        
        async function init() {
            await loadAllProducts();
            startBackgroundUpdates();
        }
        
        window.addEventListener('beforeunload', () => {
            stopBackgroundUpdates();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        init();
    </script>
</body>
</html>
